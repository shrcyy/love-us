        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
    </div>
</div>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">💕 Y & C</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>

    <main class="main-container">
        <section class="page-hero">
            <h1>留言板</h1>
            <p class="subtitle">把想说的话，悄悄写在这里。</p>
        </section>
        <div style="text-align:center;margin-bottom:24px;">
            <button class="btn btn-outline random-msg-btn fade-in" onclick="showRandomMessage()">💌 随机查看一条过往留言</button>
        </div>
        <div class="messages-grid fade-in" id="messagesGrid"></div>
        <div class="message-form fade-in" style="margin-top:36px;">
            <h3>写下你的心里话</h3>
            <input type="text" id="msgSender" placeholder="你的名字（小宇 / 小云）" maxlength="20">
            <input type="text" id="msgMood" placeholder="心情 emoji（如 💕）" maxlength="4">
            <textarea id="msgContent" placeholder="想说的话..." maxlength="500"></textarea>
            <button class="btn btn-primary" onclick="submitMessage()">发布留言</button>
            <p style="font-size:0.78rem;color:var(--text-lighter);margin-top:8px;">留言会保存在本地浏览器中，只有你们能看到。</p>
        </div>
    </main>

    <div class="random-msg-popup" id="randomMsgPopup">
        <div class="popup-card" id="randomMsgCard"></div>
    </div>

    <footer class="footer">
        <p>珍惜每一个当下，因为都是独一无二的。Made with <span class="heart">♥</span> by Y & C</p>
        <p style="font-size:0.75rem;color:var(--text-lighter);margin-top:6px;">v2.0 · 数据加密存储在 GitHub 云端 · 隐私安全</p>
    </footer>

    <script src="js/cloud.js"></script>
    <script src="js/data.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            addFAB(() => {
                document.getElementById('msgSender').focus();
                document.querySelector('.message-form').scrollIntoView({ behavior: 'smooth' });
            });
        });

        function getAllMessages() {
            return [...APP_DATA.messages].sort((a,b) => new Date(b.time) - new Date(a.time));
        }

        function loadMessages() {
            const messages = getAllMessages();
            const grid = document.getElementById('messagesGrid');
            grid.innerHTML = '';
            messages.forEach(m => {
                var replies = m.replies || [];
                var replyCount = replies.length;
                var card = document.createElement('div');
                card.className = 'message-card';
                card.innerHTML =
                    '<div class="msg-mood">' + m.mood + '</div>' +
                    '<div class="msg-sender">' + m.sender + '</div>' +
                    '<div class="msg-content">' + m.content + '</div>' +
                    '<div class="msg-time">' + m.time + (replyCount > 0 ? ' · ' + replyCount + ' 条回复' : '') + '</div>' +
                    '<button class="btn-reply-toggle" data-msgid="' + m.id + '">💬 回复</button>' +
                    '<div class="reply-section" id="replySection-' + m.id + '" style="display:none;">' +
                    renderReplies(m) +
                    '<div class="reply-input-row">' +
                    '<input type="text" class="reply-input" id="replyInput-' + m.id + '" placeholder="写下回复..." maxlength="300">' +
                    '<button class="btn btn-sm btn-primary" onclick="submitReply(' + m.id + ')">发送</button>' +
                    '</div>' +
                    '</div>';

                card.querySelector('.btn-reply-toggle').addEventListener('click', function(e) {
                    e.stopPropagation();
                    var section = document.getElementById('replySection-' + m.id);
                    var isVisible = section.style.display !== 'none';
                    section.style.display = isVisible ? 'none' : 'block';
                    this.textContent = isVisible ? '💬 回复' : '▲ 收起';
                    if (!isVisible) {
                        document.getElementById('replyInput-' + m.id).focus();
                    }
                });

                card.appendChild(createCardActions(
                    null,
                    function() {
                        showConfirm('确定要删除这条留言吗？', function() { deleteMessage(m.id); });
                    }
                ));
                grid.appendChild(card);
            });
        }

        function renderReplies(msg) {
            var replies = msg.replies || [];
            if (replies.length === 0) return '<div class="reply-list" style="display:none;"></div>';
            return '<div class="reply-list">' +
                replies.map(function(r) {
                    return '<div class="reply-item"><span class="reply-sender">' + r.sender + '</span><span class="reply-text">' + r.content + '</span><span class="reply-time">' + r.time + '</span></div>';
                }).join('') +
                '</div>';
        }

        function submitReply(msgId) {
            var input = document.getElementById('replyInput-' + msgId);
            var content = input.value.trim();
            if (!content) return;

            var msgIdx = -1;
            for (var i = 0; i < APP_DATA.messages.length; i++) {
                if (APP_DATA.messages[i].id === msgId) { msgIdx = i; break; }
            }
            if (msgIdx === -1) return;

            if (!APP_DATA.messages[msgIdx].replies) APP_DATA.messages[msgIdx].replies = [];

            var now = new Date();
            var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

            APP_DATA.messages[msgIdx].replies.push({
                id: Date.now(),
                sender: APP_DATA.person1 ? APP_DATA.person1.name : '我',
                content: content,
                time: timeStr
            });
            saveData(APP_DATA);
            input.value = '';
            loadMessages();
            // Re-open the reply section
            setTimeout(function() {
                var section = document.getElementById('replySection-' + msgId);
                var toggle = document.querySelector('.btn-reply-toggle[data-msgid="' + msgId + '"]');
                if (section) section.style.display = 'block';
                if (toggle) toggle.textContent = '▲ 收起';
            }, 100);
        }

        function submitMessage() {
            const sender = document.getElementById('msgSender').value.trim();
            const mood = document.getElementById('msgMood').value.trim() || '💌';
            const content = document.getElementById('msgContent').value.trim();
            if (!sender || !content) { alert('请填写名字和留言内容哦~'); return; }
            const now = new Date();
            const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            APP_DATA.messages.push({ id: generateId(APP_DATA.messages), sender, mood, content, time: timeStr, replies: [] });
            saveData(APP_DATA);
            document.getElementById('msgSender').value = '';
            document.getElementById('msgMood').value = '';
            document.getElementById('msgContent').value = '';
            loadMessages();
            if (typeof playSuccess === 'function') playSuccess();
        }

        function deleteMessage(id) {
            APP_DATA.messages = APP_DATA.messages.filter(m => m.id !== id);
            saveData(APP_DATA);
            loadMessages();
            if (typeof playDelete === 'function') playDelete();
        }

        function showRandomMessage() {
            const messages = getAllMessages();
            if (messages.length === 0) return;
            const random = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('randomMsgCard').innerHTML = `
                <div style="font-size:3rem;margin-bottom:12px;">${random.mood}</div>
                <div style="font-weight:600;color:var(--primary);margin-bottom:8px;">${random.sender}</div>
                <div style="color:var(--text-light);line-height:1.8;margin-bottom:10px;">${random.content}</div>
                <div style="font-size:0.82rem;color:var(--text-lighter);">${random.time}</div>
                <button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="document.getElementById('randomMsgPopup').classList.remove('active')">关闭</button>`;
            document.getElementById('randomMsgPopup').classList.add('active');
        }

        document.getElementById('randomMsgPopup').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });
    </script>

<script>

    function hideLoader() { var el = document.getElementById('page-loader'); if (el) el.classList.add('hide'); }
    window.addEventListener('load', function() { setTimeout(hideLoader, 600); });
    setTimeout(hideLoader, 5000);
})();
</script>

</body>
