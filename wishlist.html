    <main class="main-container">
        <section class="page-hero">
            <h1>愿望清单</h1>
            <p class="subtitle">一起许下的愿望，一起慢慢实现。</p>
        </section>
        <div class="wishlist-stats fade-in">
            <div class="stats-number" id="wishStats">--</div>
            <div style="margin-top:8px;"><span style="color:var(--text-light);">已完成愿望</span></div>

        </div>
        <div class="wish-filter fade-in" id="wishFilter">
            <button class="wish-filter-btn active" data-filter="all">全部</button>

        </div>

        <p>珍惜每一个当下，因为都是独一无二的。Made with <span class="heart">♥</span> by Y & C</p>

    <script src="js/cloud.js"></script>

    <script src="js/main.js"></script>
    <script>
        var currentWishFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initWishFilter();
            refreshWishes();
            addFAB(() => showAddWishModal());
        });

        function initWishFilter() {
            document.querySelectorAll('#wishFilter .wish-filter-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#wishFilter .wish-filter-btn').forEach(function(b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    currentWishFilter = btn.dataset.filter;
                    refreshWishes();
                });
            });
        }

        function refreshWishes() {
            var allWishes = APP_DATA.wishes;
            var wishes = allWishes;
            if (currentWishFilter === 'todo') {
                wishes = allWishes.filter(function(w) { return !w.done; });
            } else if (currentWishFilter === 'done') {
                wishes = allWishes.filter(function(w) { return w.done; });
            }

            const doneCount = allWishes.filter(w => w.done).length;
            const total = allWishes.length;
            const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
            document.getElementById('wishStats').textContent = `${doneCount} / ${total}`;
            document.getElementById('wishProgress').style.width = pct + '%';

            const grid = document.getElementById('wishlistGrid');
            grid.innerHTML = '';
            wishes.forEach(w => {
                const priorityLabels = { high: '高优先级', medium: '中优先级', low: '低优先级' };
                const card = document.createElement('div');
                card.className = `wish-card ${w.done ? 'done' : ''}`;
                card.innerHTML = `
                    <div class="wish-name">${w.name}</div>
                    <div class="wish-desc">${w.desc}</div>
                    <div class="wish-meta">
                        <span class="badge badge-${w.priority}">${priorityLabels[w.priority]}</span>
                        ${w.done ? '<span class="badge badge-done">已完成</span>' : '<span class="badge">待完成</span>'}
                    </div>
                    ${w.done && w.doneDate ? `<div class="wish-done-date" style="margin-top:6px;">完成于 ${formatDate(w.doneDate)}</div>` : ''}`;
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.card-actions')) return;
                    toggleWishDone(w.id);
                });
                card.appendChild(createCardActions(
                    () => { if (typeof playClick === 'function') playClick(); showEditWishModal(w); },
                    () => {
                        showConfirm('确定要删除愿望「' + w.name + '」吗？此操作不可撤销。', () => {
                            if (typeof playDelete === 'function') playDelete();
                            deleteWish(w.id);
                        });
                    }
                ));
                grid.appendChild(card);
            });
        }

        function toggleWishDone(id) {
            const index = APP_DATA.wishes.findIndex(w => w.id === id);
            if (index > -1) {
                APP_DATA.wishes[index].done = !APP_DATA.wishes[index].done;
                APP_DATA.wishes[index].doneDate = APP_DATA.wishes[index].done ? getTodayDateStr() : null;
                saveData(APP_DATA);
                refreshWishes();
            }
        }

        function showAddWishModal() {
            showModal({
                title: '添加愿望',
                bodyHTML: `
                    <div class="form-group"><label class="form-label">愿望名称</label><input type="text" id="wishName" class="form-input" placeholder="想一起做什么..."></div>
                    <div class="form-group"><label class="form-label">描述</label><textarea id="wishDesc" class="form-textarea" rows="2" placeholder="详细描述这个愿望..."></textarea></div>
                    <div class="form-group"><label class="form-label">优先级</label><select id="wishPriority" class="form-input"><option value="high">高优先级</option><option value="medium" selected>中优先级</option><option value="low">低优先级</option></select></div>
                `,
                onSave: (close) => {
                    const name = document.getElementById('wishName').value.trim();
                    const desc = document.getElementById('wishDesc').value.trim();
                    const priority = document.getElementById('wishPriority').value;
                    if (!name) { alert('请填写愿望名称'); return; }
                    APP_DATA.wishes.push({ id: generateId(APP_DATA.wishes), name, desc, priority, done: false, doneDate: null });
                    saveData(APP_DATA);
                    refreshWishes();
                    close();
                }
            });
        }

        function showEditWishModal(wish) {
            showModal({
                title: '编辑愿望',
                bodyHTML: `
                    <div class="form-group"><label class="form-label">愿望名称</label><input type="text" id="wishNameEdit" class="form-input" value="${wish.name}"></div>
                    <div class="form-group"><label class="form-label">描述</label><textarea id="wishDescEdit" class="form-textarea" rows="2">${wish.desc||''}</textarea></div>
                    <div class="form-group"><label class="form-label">优先级</label><select id="wishPriorityEdit" class="form-input"><option value="high" ${wish.priority==='high'?'selected':''}>高优先级</option><option value="medium" ${wish.priority==='medium'?'selected':''}>中优先级</option><option value="low" ${wish.priority==='low'?'selected':''}>低优先级</option></select></div>
                `,
                onSave: (close) => {
                    const name = document.getElementById('wishNameEdit').value.trim();
                    const desc = document.getElementById('wishDescEdit').value.trim();
                    const priority = document.getElementById('wishPriorityEdit').value;
                    if (!name) { alert('请填写愿望名称'); return; }
                    const index = APP_DATA.wishes.findIndex(w => w.id === wish.id);
                    if (index > -1) { APP_DATA.wishes[index] = { ...APP_DATA.wishes[index], name, desc, priority }; saveData(APP_DATA); refreshWishes(); }
                    close();
                }
            });
        }

        function deleteWish(id) {
            APP_DATA.wishes = APP_DATA.wishes.filter(w => w.id !== id);
            saveData(APP_DATA);
            refreshWishes();
        }
    </script>
